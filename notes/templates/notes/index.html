{% extends 'notes/base.html' %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Your Notes</h3>
        <a href="{% url 'add_note' %}" class="btn btn-success">+ Add Note</a>
    </div>
    {% for note in notes %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ note.title }}</h5>
                <p class="card-text">{{ note.content }}</p>
                <p class="card-text"><small class="text-muted">{{ note.created_at }}</small></p>
                <a href="{% url 'edit_note' note.id %}" class="btn btn-sm btn-primary">Edit</a>
                <a href="{% url 'delete_note' note.id %}" class="btn btn-sm btn-danger">Delete</a>
            </div>
        </div>
    {% empty %}
        <p>No notes found. <a href="{% url 'add_note' %}">Create one</a>!</p>
    {% endfor %}
{% endblock %}
